<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1424">
  <title>Летопис</title>
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage"></div>
  <div id="loading">Светът се събужда…</div>

  <header class="top">
    <div class="brand">Летопис <span id="conn" class="conn off" title="Връзка със сървъра"></span><small id="build" class="build"></small></div>
    <div class="time">
      <div class="year" id="year">…</div>
      <div class="sub"><span id="month"></span> · <span id="era"></span></div>
      <div class="sub next" id="nextEra"></div>
      <div class="tick"><i id="tickBar"></i></div>
    </div>
    <div class="stats">
      <div><span>Хора</span><b id="pop">0</b></div>
      <div><span>Родове</span><b id="bandsCount">0</b></div>
      <div class="wide"><span>Родени</span><b id="born">0</b></div>
      <div class="wide"><span>Починали</span><b id="died">0</b></div>
      <div class="wide"><span>Светът живее</span><b id="age">0</b></div>
    </div>
  </header>

  <aside class="side">
    <button id="sideHandle" class="side-handle" title="Скрий или покажи панела" aria-label="Скрий или покажи панела"><span>›</span></button>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="chronicle">Летопис</button>
      <button class="tab" role="tab" data-tab="discoveries">Открития</button>
      <button class="tab" role="tab" data-tab="bands">Родове</button>
      <button class="tab" role="tab" data-tab="kingdoms">Царства</button>
      <button class="tab" role="tab" data-tab="heroes">Личности</button>
      <button class="tab" role="tab" data-tab="famous">Известни личности</button>
      <button class="tab" role="tab" data-tab="stats">Статистика</button>
      <button class="tab" role="tab" data-tab="secrets">Тайни</button>
    </nav>
    <div id="sideBody" class="side-body"></div>
  </aside>

  <div class="controls">
    <button id="zoomIn" class="btn round" title="Приближи">+</button>
    <button id="zoomOut" class="btn round" title="Отдалечи">−</button>
    <button id="tourBtn" class="btn" aria-pressed="false" title="Камерата сама обикаля света">Разходка</button>
    <button id="nightBtn" class="btn" aria-pressed="true" title="Смяна на ден и нощ">Нощ</button>
    <button id="planetBtn" class="btn" hidden>Марс</button>
    <span class="sound-wrap maps-wrap" hidden>
      <button id="mapBtn" class="btn" aria-expanded="false">Карти</button>
      <div id="mapsPanel" class="sound-panel maps-panel" hidden></div>
    </span>
    <span class="sound-wrap">
      <button id="soundBtn" class="btn" aria-pressed="false" aria-expanded="false" title="Музика и звуци">Звук</button>
      <div id="soundPanel" class="sound-panel" hidden>
        <div class="sound-row"><button id="musicToggle" class="btn" aria-pressed="false" title="Тиха музика на епохата">Музика</button><input id="musicVol" type="range" min="0" max="100" aria-label="Сила на музиката"></div>
        <div class="sound-row"><button id="sfxToggle" class="btn" aria-pressed="false" title="Звуците на мястото под камерата">Звуци</button><input id="sfxVol" type="range" min="0" max="100" aria-label="Сила на звуците"></div>
      </div>
    </span>
    <span class="sound-wrap app-wrap" hidden>
      <button id="newsBtn" class="btn" aria-expanded="false" title="Известия на телефона">Известия</button>
      <div id="newsPanel" class="sound-panel news-panel" hidden></div>
    </span>
    <button id="kidsBtn" class="btn" aria-pressed="false" title="По-едри букви и детски обяснения">Детски режим</button>
    <button id="sideToggle" class="btn" title="Скрий или покажи летописа">Панел</button>
    <select id="langSel" class="btn lang" title="Език / Language / Sprache" aria-label="Език / Language / Sprache"><option value="bg">БГ</option><option value="en">EN</option><option value="de">DE</option></select>
    <button id="helpBtn" class="btn round help" title="Новости и помощ" aria-label="Новости и помощ">?</button>
  </div>

  <div id="toasts"></div>

  <div id="card" class="card" hidden>
    <button id="cardClose" class="btn round close" title="Затвори">×</button>
    <div id="cardBody"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
